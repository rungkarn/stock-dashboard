name: Update prices & deploy

on:
  schedule:
    # 11:15 UTC = 18:15 Thai time, Mon–Fri (SET closes 16:30; GitHub may start a cron late)
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download 5 years for every symbol"
        type: boolean
        default: false
      weekly_issue:
        description: "Post the weekly summary as an issue now (normally Fridays only)"
        type: boolean
        default: false
  push:
    branches: [main]
    # data/prices is pushed by this workflow itself (GITHUB_TOKEN pushes never re-trigger);
    # a PC push of data/set_info* should redeploy the page.
    paths-ignore: ["data/prices/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch prices (Yahoo Finance) and rebuild summary
        if: github.event_name != 'push'
        run: python scripts/fetch_prices.py ${{ inputs.full && '--full' || '' }}

      - name: Backtest + weekly summary (no network)
        if: github.event_name != 'push'
        run: |
          python scripts/backtest.py
          python scripts/weekly_summary.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Sanity-check data
        run: python scripts/check_data.py

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data/prices; then
            echo "No new data (holiday?)"
          else
            git commit -m "data: prices $(date -u +%F)"
            git push
          fi

      # Friday evening: post data/weekly.md as an issue that @mentions the owner, so GitHub
      # emails it. The previous weekly issue is closed to keep one open at a time.
      - name: Weekly summary issue (Fridays)
        if: github.event_name == 'schedule' || inputs.weekly_issue
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.weekly_issue && '1' || '' }}
        run: |
          if [ -z "$FORCE" ] && [ "$(TZ=Asia/Bangkok date +%u)" != "5" ]; then echo "Not Friday - skip"; exit 0; fi
          gh label create weekly --color 2a78d6 --description "สรุปสัปดาห์อัตโนมัติ" 2>/dev/null || true
          for n in $(gh issue list --label weekly --state open --json number -q '.[].number'); do gh issue close "$n" --comment "แทนที่ด้วยสรุปสัปดาห์ใหม่"; done
          {
            echo "@${{ github.repository_owner }} สรุปสัปดาห์อัตโนมัติ · dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo
            sed '1d' data/weekly.md
          } > /tmp/weekly_body.md
          title="$(head -1 data/weekly.md | sed 's/^# //')"
          gh issue create --title "$title" --label weekly --body-file /tmp/weekly_body.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
