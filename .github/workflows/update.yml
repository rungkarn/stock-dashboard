name: Update prices & deploy

on:
  schedule:
    # 11:15 UTC = 18:15 Thai time, Mon–Fri (SET closes 16:30; GitHub may start a cron late)
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download 2 years for every symbol"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch prices (Yahoo Finance) and rebuild summary
        if: github.event_name != 'push'
        run: python scripts/fetch_prices.py ${{ inputs.full && '--full' || '' }}

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data/prices; then
            echo "No new data (holiday?)"
          else
            git commit -m "data: prices $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
